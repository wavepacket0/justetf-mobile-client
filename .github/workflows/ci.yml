name: Cross-platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test/requirements.txt
      - name: Run offline Go and Python suites
        run: python test/run.py --mode offline

  live-readonly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    environment: test-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test/requirements.txt
      - name: Run live read-only Go and Python suites
        env:
          JUSTETF_TEST_EMAIL: ${{ secrets.JUSTETF_TEST_EMAIL }}
          JUSTETF_TEST_PASSWORD: ${{ secrets.JUSTETF_TEST_PASSWORD }}
        run: python test/run.py --mode online-readonly
