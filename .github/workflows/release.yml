name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build, for example v0.1.0
        required: true
        type: string
      publish_pypi:
        description: Publish the built wheels to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-release-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None:
              raise SystemExit("release_tag must use the vMAJOR.MINOR.PATCH format")

          version = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} must match package version v{version}")

          subprocess.run(["git", "fetch", "origin", "main", "--tags"], check=True)
          tag_commit = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          main_commit = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", tag_commit, main_commit], check=True)
          PY
      - name: Verify GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

  wheels:
    if: github.ref == 'refs/heads/main'
    needs: validate-release-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Install wheel builder
        run: python -m pip install --upgrade pip cibuildwheel
      - name: Stage package metadata files
        shell: bash
        run: |
          cp LICENSE python/LICENSE
          cp README.md python/README.md
      - name: Build and test platform wheel
        run: python -m cibuildwheel --config-file python/pyproject.toml --output-dir wheelhouse python
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  attach-release-assets:
    if: github.ref == 'refs/heads/main'
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: release-assets
          merge-multiple: true
      - name: Attach wheels to the existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/*.whl --clobber --repo "$GITHUB_REPOSITORY"

  publish-pypi:
    if: github.ref == 'refs/heads/main' && inputs.publish_pypi
    needs: attach-release-assets
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/justetf-mobile-client/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1