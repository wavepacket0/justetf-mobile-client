[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "justetf-mobile-client"
version = "0.1.0"
description = "Native Python bindings for the Go justETF mobile API client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wavepacket0" }]

[project.urls]
Homepage = "https://github.com/wavepacket0/justetf-mobile-client"
Source = "https://github.com/wavepacket0/justetf-mobile-client"

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
archs = ["auto64"]
build = "cp310-*"
skip = "*-musllinux_*"
test-command = "python {project}/test/wheel_smoke.py"

[tool.cibuildwheel.windows]
repair-wheel-command = ""

[tool.cibuildwheel.macos]
repair-wheel-command = ""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = '''
set -eu
case "$(uname -m)" in
  x86_64) GOARCH=amd64; GOSUM=65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40;;
  aarch64) GOARCH=arm64; GOSUM=a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49;;
esac
curl -fsSLo /tmp/go.tar.gz "https://go.dev/dl/go1.27.3.linux-${GOARCH}.tar.gz"
echo "${GOSUM}  /tmp/go.tar.gz" | sha256sum -c -
tar -C /usr/local -xzf /tmp/go.tar.gz
ln -sf /usr/local/go/bin/go /usr/local/bin/go
'''